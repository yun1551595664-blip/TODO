name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard committed files
        run: |
          forbidden="$(git ls-files | grep -E '(^|/)(\.env|node_modules|dist|target|output)(/|$)|\.log$|tsbuildinfo$' || true)"
          if [ -n "$forbidden" ]; then
            echo "Forbidden files are committed:"
            echo "$forbidden"
            exit 1
          fi

      - name: Documentation contract
        run: bash scripts/verify-docs.sh

      - name: Deployment script contract
        run: |
          for script in scripts/check-env.sh scripts/docker-smoke.sh scripts/mysql-backup.sh scripts/mysql-restore.sh; do
            bash -n "$script"
          done
          ALLOW_DEV_DEFAULTS=true bash scripts/check-env.sh .env.example

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Backend tests
        working-directory: backend
        run: mvn test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Frontend E2E
        working-directory: frontend
        run: npm run test:e2e
