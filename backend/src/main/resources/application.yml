server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/issue_ops?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123456}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-v4-pro}
ai:
  provider: ${AI_PROVIDER:deepseek}
  api-key: ${AI_API_KEY:${DEEPSEEK_API_KEY:}}
  base-url: ${AI_BASE_URL:${DEEPSEEK_BASE_URL:}}
  model: ${AI_MODEL:${DEEPSEEK_MODEL:deepseek-v4-pro}}
  timeout-ms: ${AI_TIMEOUT_MS:60000}
  temperature: ${AI_TEMPERATURE:0.2}
  max-tokens: ${AI_MAX_TOKENS:2000}
auth:
  secret: ${AUTH_SECRET:dev-local-issue-ops-secret-change-me}
  token-ttl-seconds: ${AUTH_TOKEN_TTL_SECONDS:28800}
  users: ${AUTH_USERS:admin|admin123|ADMIN|照远;product|product123|PRODUCT|产品负责人;tech|tech123|TECH|技术负责人;cs|cs123|CS|客服同学;viewer|viewer123|VIEWER|观察员}
  sso:
    enabled: ${AUTH_SSO_ENABLED:false}
    provider-name: ${AUTH_SSO_PROVIDER_NAME:企业 SSO}
    login-url: ${AUTH_SSO_LOGIN_URL:}
